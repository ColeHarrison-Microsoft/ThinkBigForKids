; PlatformIO project configuration for the ThinkBigForKids robotics library.
;
; This file lives in src/ so all code-project files stay under src/. The native
; "sim" envs build a terminal simulator binary that runs on Windows/Linux/macOS
; with no hardware. Each runnable program (a student lesson or a reference
; solution) gets its own env that compiles the simulator core (sim/) plus
; exactly one program file that defines runStudentProgram().
;
; Build & run examples (from the src/ directory):
;   pio run -e lesson1            ; build the Lesson 1 student scaffold
;   pio run -e lesson1 -t exec    ; build and run it
;   pio run -e example_lesson5 -t exec
;
; The AVR backends (mbot, arduino_car) are planned but not implemented yet —
; see ToDo.md. Stub envs are left commented out below.

[platformio]
src_dir = ${PROJECT_DIR}
include_dir = ${PROJECT_DIR}/include
default_envs = lesson1

[env]
platform = native
; Statically link the C/C++ runtimes (see scripts/static_link.py) so the built
; binary runs on its own without the MinGW/GCC runtime DLLs on PATH.
build_flags = -std=c++17 -Wall
extra_scripts = post:scripts/static_link.py

; --- Student lesson scaffolds ---

[env:lesson1]
build_src_filter = -<*> +<sim/> +<student/lesson1_basic_movement/>

[env:lesson5]
build_src_filter = -<*> +<sim/> +<student/lesson5_obstacle_avoidance/>

; --- Reference solutions (volunteer-facing) ---

[env:example_lesson1]
build_src_filter = -<*> +<sim/> +<examples/lesson1_basic_movement/>

[env:example_lesson5]
build_src_filter = -<*> +<sim/> +<examples/lesson5_obstacle_avoidance/>

