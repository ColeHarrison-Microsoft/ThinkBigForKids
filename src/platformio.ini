; PlatformIO project configuration for the ThinkBigForKids robotics library.
;
; This file lives in src/ so all code-project files stay under src/. The native
; "sim" envs build a terminal simulator binary that runs on Windows/Linux/macOS
; with no hardware. Each runnable program (a student lesson or a reference
; solution) gets its own env that compiles the simulator core (sim/) plus
; exactly one program file that defines runStudentProgram().
;
; Build & run examples (from the src/ directory):
;   pio run -e lesson1            ; build the Lesson 1 student scaffold
;   pio run -e lesson1 -t exec    ; build and run it
;   pio run -e example_lesson5 -t exec
;
; The AVR backends (mbot, arduino_car) are planned but not implemented yet —
; see ToDo.md. Stub envs are left commented out below.

[platformio]
src_dir = ${PROJECT_DIR}
include_dir = ${PROJECT_DIR}/include
default_envs = lesson1

[env]
platform = native
; Statically link the C/C++ runtimes (see scripts/static_link.py) so the built
; binary runs on its own without the MinGW/GCC runtime DLLs on PATH.
; -g adds debug symbols so the VS Code debugger (launch.json) can set breakpoints.
; -Wno-unused-variable keeps the build clean for the student scaffolds, whose
; helper constants stay unused until the // !EDIT blanks are filled in.
build_flags = -std=c++17 -Wall -Wno-unused-variable -g
extra_scripts = post:scripts/static_link.py

; --- Student lesson scaffolds ---

[env:lesson1]
build_src_filter = -<*> +<sim/> +<student/lesson1_basic_movement/>

[env:lesson2]
build_flags = ${env.build_flags} -DWORLD_REMOTE
build_src_filter = -<*> +<sim/> +<student/lesson2_ir_remote/>

[env:lesson3]
build_flags = ${env.build_flags} -DWORLD_FOLLOW
build_src_filter = -<*> +<sim/> +<student/lesson3_object_following/>

[env:lesson4]
build_flags = ${env.build_flags} -DWORLD_LINE
build_src_filter = -<*> +<sim/> +<student/lesson4_line_following/>

[env:lesson5]
build_src_filter = -<*> +<sim/> +<student/lesson5_obstacle_avoidance/>

; --- Reference solutions (volunteer-facing) ---

[env:example_lesson1]
build_src_filter = -<*> +<sim/> +<examples/lesson1_basic_movement/>

[env:example_lesson2]
build_flags = ${env.build_flags} -DWORLD_REMOTE
build_src_filter = -<*> +<sim/> +<examples/lesson2_ir_remote/>

[env:example_lesson3]
build_flags = ${env.build_flags} -DWORLD_FOLLOW
build_src_filter = -<*> +<sim/> +<examples/lesson3_object_following/>

[env:example_lesson4]
build_flags = ${env.build_flags} -DWORLD_LINE
build_src_filter = -<*> +<sim/> +<examples/lesson4_line_following/>

[env:example_lesson5]
build_src_filter = -<*> +<sim/> +<examples/lesson5_obstacle_avoidance/>

; ============================================================================
; Hardware backends (AVR) — cross-compile to the robots.
; ============================================================================
;
; Each hardware env compiles its backend (mbot/ or arduino_car/) plus exactly
; one program file that defines runStudentProgram() — a student scaffold under
; student/ or a reference solution under examples/. The backend's main_*.cpp
; supplies the Arduino setup()/loop() entry point.
;
; The static-link post-script (scripts/static_link.py) is a no-op on AVR, and
; these envs override build_flags/extra_scripts so the native sim settings do
; not leak in.
;
; Build / flash (from src/, robot connected over USB):
;   pio run -e mbot_example1 -t upload    ; flash the Lesson 1 solution to mBot
;   pio run -e mbot_lesson5  -t upload    ; flash your filled-in Lesson 5 scaffold
;   pio run -e arduino_car_example1       ; compile-check the Arduino-car L1 solution
;
; Classic mBot = mCore board (ATmega328P), so board = uno. The Makeblock library
; is pulled from upstream (not vendored), per AGENTS.md.

[avr_base]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Wall -Wno-unused-variable
extra_scripts =

[mbot_base]
extends = avr_base
lib_deps = https://github.com/Makeblock-official/Makeblock-Libraries.git
build_flags = ${avr_base.build_flags} -DMBOT

[arduino_car_base]
extends = avr_base
; Lesson 2 uses a real IR receiver (IRremote). Lesson 5's head uses Servo —
; pinned explicitly because PlatformIO's LDF does not always expose the
; framework-bundled Servo on the native registry resolver.
lib_deps = Arduino-IRremote/IRremote@^4.4.1, arduino-libraries/Servo@^1.2.2
build_flags = ${avr_base.build_flags} -DARDUINO_CAR

; --- mBot: student scaffolds ---
[env:mbot_lesson1]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<student/lesson1_basic_movement/>

[env:mbot_lesson2]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<student/lesson2_ir_remote/>

[env:mbot_lesson3]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<student/lesson3_object_following/>

[env:mbot_lesson4]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<student/lesson4_line_following/>

[env:mbot_lesson5]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<student/lesson5_obstacle_avoidance/>

; --- mBot: reference solutions (use these to verify hardware behavior) ---
[env:mbot_example1]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<examples/lesson1_basic_movement/>

[env:mbot_example2]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<examples/lesson2_ir_remote/>

[env:mbot_example3]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<examples/lesson3_object_following/>

[env:mbot_example4]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<examples/lesson4_line_following/>

[env:mbot_example5]
extends = mbot_base
build_src_filter = -<*> +<mbot/> +<examples/lesson5_obstacle_avoidance/>

; --- Arduino car: student scaffolds ---
[env:arduino_car_lesson1]
extends = arduino_car_base
build_src_filter = -<*> +<arduino_car/> +<student/lesson1_basic_movement/>

[env:arduino_car_lesson2]
